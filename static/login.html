<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Student Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/theme3d.css">
</head>
<body>
  <header>
    <div class="logo">🎓</div>
    <div>
      <h1>Student <span>Dashboard</span></h1>
      <p><i class="live"></i> ATTENDANCE &amp; MARKS PORTAL<span class="cursor">_</span></p>
    </div>
  </header>

  <div class="login-wrap">
    <div class="box login-card tilt">
      <h2>&gt; Login</h2>

      <div class="roles">
        <button class="on" onclick="pick('student', this)">🎓 Student</button>
        <button onclick="pick('teacher', this)">📚 Teacher</button>
        <button onclick="pick('admin', this)">🛡️ Admin</button>
      </div>

      <label class="field" id="uLabel">Roll No</label>
      <input id="u" placeholder="e.g. 22CS001" autocomplete="username">

      <label class="field">Password</label>
      <input id="p" type="password" placeholder="••••••" autocomplete="current-password">

      <div class="msg" id="msg"></div>
      <button class="btn" onclick="doLogin()">LOGIN &gt;</button>
      <div class="hint" style="margin-top:12px"><a href="#" onclick="openForgot(); return false" style="color:var(--cyan)">Forgot password?</a></div>

      <div class="hint" id="hint">First login: your password is the same as your roll no. Change it after logging in.</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/static/common.js"></script>
  <script>
    let role = "student";
    const texts = {
      student: ["Roll No", "e.g. 22CS001", "First login: your password is the same as your roll no. Change it after logging in."],
      teacher: ["Username", "your teacher username", "Your username and first password are given by the admin."],
      admin:   ["Username", "admin", "Only the college admin can use this."]
    };

    function pick(r, btn) {
      role = r;
      document.querySelectorAll(".roles button").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      document.getElementById("uLabel").textContent = texts[r][0];
      document.getElementById("u").placeholder = texts[r][1];
      document.getElementById("hint").textContent = texts[r][2];
      document.getElementById("msg").textContent = "";
    }

    async function doLogin() {
      const msg = document.getElementById("msg");
      const username = document.getElementById("u").value.trim();
      const password = document.getElementById("p").value;
      if (!username || !password) { msg.textContent = "> Enter username and password"; return; }

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) { msg.textContent = "> " + data.error; return; }

      if (data.role !== role) {
        await fetch("/api/logout", { method: "POST" });
        msg.textContent = "> This is a " + data.role + " account. Choose the " + data.role + " tab.";
        return;
      }
      location.href = "/" + data.role;
    }

    document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  </script>
<script>
async function postJson(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  return { ok: r.ok, data };
}

function openForgot() {
  const isAdmin = role === "admin";
  const w = document.createElement("div");
  w.style.cssText = "position:fixed;inset:0;z-index:200;background:rgba(2,6,12,.94);display:grid;place-items:center;padding:20px;overflow:auto";
  const field = (id, label, type) => '<label class="field">' + label + '</label><input id="' + id + '" type="' + (type || "text") + '" autocomplete="off">';
  w.innerHTML = '<div class="box login-card"><h2>&gt; Forgot password</h2>' + (isAdmin
    ? '<div class="note">Enter your admin username, the recovery code you saved earlier, and a new password (min 8 characters).</div>' +
      field("fUser", "Admin username") + field("fCode", "Recovery code (XXXX-XXXX-XXXX-XXXX)") +
      field("fNew", "New password", "password") + field("fNew2", "Repeat new password", "password")
    : '<div class="note">Enter your username (roll no for students). The admin will see your request and give you a temporary password in person.</div>' +
      field("fUser", "Username / Roll no")) +
    '<div class="msg" id="fMsg"></div><div id="fOut"></div>' +
    '<button class="btn" id="fGo">' + (isAdmin ? "RESET PASSWORD" : "SEND REQUEST") + ' &gt;</button>' +
    '<button class="btn" id="fClose" style="margin-top:10px;background:#1d3552;color:var(--cyan)">CLOSE</button></div>';
  document.body.appendChild(w);

  const say = (t, ok) => {
    const m = document.getElementById("fMsg");
    m.textContent = "> " + t;
    m.style.color = ok ? "var(--green)" : "var(--red)";
    m.style.textShadow = "none";
  };
  const val = id => document.getElementById(id).value.trim();

  async function go() {
    if (!val("fUser")) return say("Enter your username", false);
    if (!isAdmin) {
      const r = await postJson("/api/forgot", { username: val("fUser") });
      return say(r.data.message || r.data.error || "Something went wrong", r.ok);
    }
    if (document.getElementById("fNew").value !== document.getElementById("fNew2").value)
      return say("The two new passwords do not match", false);
    const r = await postJson("/api/forgot-admin", {
      username: val("fUser"), code: val("fCode"), new: document.getElementById("fNew").value
    });
    if (!r.ok) return say(r.data.error || "Something went wrong", false);
    say("Password changed. You can log in now.", true);
    document.getElementById("fOut").innerHTML =
      '<div class="result"><div>Your NEW recovery code (the old one no longer works). Save it somewhere safe:</div>' +
      '<div style="font-family:var(--pixel);font-size:13px;color:var(--yellow);margin:10px 0">' + r.data.new_code + '</div></div>';
    document.getElementById("fGo").style.display = "none";
  }
  document.getElementById("fGo").onclick = go;
  document.getElementById("fClose").onclick = () => w.remove();
  w.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}
</script>
</body>
</html>
